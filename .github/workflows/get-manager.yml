name: GetManager

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      ksu_variant:
        required: true
        type: string
    outputs:
      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}
      managerVer:
        description: "官方最新上传 Manager 构建的实测版本号"
        value: ${{ jobs.get_ksu_manager.outputs.managerVer }}
      ksuCommit:
        description: "官方最新上传 Manager 构建对应的提交 SHA（内核侧对齐用）"
        value: ${{ jobs.get_ksu_manager.outputs.ksuCommit }}
      managerCertSize:
        description: "FinaSU 管理器签名证书 DER 尺寸（0x 十六进制，内核第二信任槽对齐用）"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertSize }}
      managerCertHash:
        description: "FinaSU 管理器签名证书 SHA256（内核第二信任槽对齐用）"
        value: ${{ jobs.get_ksu_manager.outputs.managerCertHash }}
jobs:
  get_ksu_manager:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
      # 输出3: Manager 实测版本号
      managerVer: ${{ steps.add_KSU.outputs.managerVer }}
      # 输出4: 官方最新上传构建的提交 SHA（内核侧对齐用）
      ksuCommit: ${{ steps.add_KSU.outputs.ksuCommit }}
      # 输出5/6: FinaSU 管理器签名证书（内核第二信任槽对齐用）
      managerCertSize: ${{ steps.add_KSU.outputs.managerCertSize }}
      managerCertHash: ${{ steps.add_KSU.outputs.managerCertHash }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 检出脚本仓库
        uses: actions/checkout@v6

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |
          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
            echo "This is the BakaSU variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU" ]; then
            echo "This is the FinaSU variant"
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU-dev" ]; then
            echo "This is the FinaSU dev-channel variant"
            # dev 渠道的管理器只由 dev 分支 CI 产出，版本号必须按 dev 的提交数计算
            git clone --branch dev https://github.com/LyraVoid/FinaSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # 计算KSU版本号
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU" ] || [ "${{ inputs.ksu_variant }}" == "FinaSU-dev" ]; then
            # FinaSU 内核 Kbuild 与管理器 build.gradle.kts 均以 30000 + git 提交数计算版本
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          else
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop"
          SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

          echo "KSU_VERSION (for manager consistency check): $KSU_VERSION / SUSFS module: $SUS_VERSION"

      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        run: |
          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ]; then
            echo "SukiSU..."
            REPO="SukiSU-Ultra/SukiSU-Ultra"
            KSUM="manager"
            EXPECTED_BRANCH="main"
          elif [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
            echo "BakaSU..."
            REPO="Baka-SU/BakaSU"
            KSUM="manager"
            EXPECTED_BRANCH="main"
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU" ]; then
            echo "FinaSU..."
            REPO="LyraVoid/FinaSU"
            KSUM="manager"
            EXPECTED_BRANCH="master"
          elif [ "${{ inputs.ksu_variant }}" == "FinaSU-dev" ]; then
            echo "FinaSU (dev channel)..."
            REPO="LyraVoid/FinaSU"
            KSUM="manager"
            EXPECTED_BRANCH="dev"
          fi

          # ── FinaSU：只从官方 GitHub Release 拉取管理器（不走 CI 构建产物）──────────
          # dev 渠道没有 Release，故意不进这个分支：它走下面的 CI 产物路径（dev 分支）
          if [ "${{ inputs.ksu_variant }}" == "FinaSU" ]; then
            REL_JSON=""
            for ATTEMPT in 1 2 3; do
              REL_JSON=$(curl -s --fail --max-time 30 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/LyraVoid/FinaSU/releases/latest") && [ -n "$REL_JSON" ] && break
              echo "获取 FinaSU 最新 Release 失败，重试 ($ATTEMPT/3)..."
              sleep 5
            done
            [ -z "$REL_JSON" ] && { echo "无法获取 FinaSU 最新 Release 信息"; exit 1; }

            REL_TAG=$(printf '%s' "$REL_JSON" | jq -r '.tag_name')
            REL_APK_URL=$(printf '%s' "$REL_JSON" | jq -r '[.assets[] | select(.name | endswith("-release.apk"))][0].browser_download_url')
            # /releases/latest 不含 pre-release；无 APK 资产时回退检索最近 10 个 Release
            if [ -z "$REL_APK_URL" ] || [ "$REL_APK_URL" = "null" ]; then
              echo "Release $REL_TAG 中无 APK 资产，回退检索最近 Release 列表..."
              REL_LIST=$(curl -s --fail --max-time 30 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/LyraVoid/FinaSU/releases?per_page=10")
              REL_APK_URL=$(printf '%s' "$REL_LIST" | jq -r '[.[] | select(.draft == false) | .assets[] | select(.name | endswith("-release.apk")) | .browser_download_url][0]')
            fi
            if [ -z "$REL_APK_URL" ] || [ "$REL_APK_URL" = "null" ]; then
              echo "FinaSU 最近的 Release 中均未找到管理器 APK"
              exit 1
            fi

            echo "下载 FinaSU 发行版管理器: Release $REL_TAG"
            rm -rf manager-artifacts
            mkdir -p manager-artifacts
            APK_NAME=$(basename "$REL_APK_URL")
            if ! curl -sL --fail --retry 3 --max-time 300 -o "manager-artifacts/$APK_NAME" "$REL_APK_URL"; then
              echo "下载 FinaSU 管理器失败: $REL_APK_URL"
              exit 1
            fi
            APK_FILE="manager-artifacts/$APK_NAME"

            # APK 文件名形如 FinaSU_v0.1.0-beta5_32794-release.apk，末段数字即 versionCode
            CLEAN_NAME=$(basename "$APK_FILE" | sed -E 's/-(arm64-v8a|armeabi-v7a|armv7|riscv64|x86_64|x86|universal)-release\.apk$/.apk/')
            ACTUAL_VERSION=$(echo "$CLEAN_NAME" | grep -oE '_[0-9]+-release\.apk$' | tail -n 1 | sed 's/^_//; s/-release\.apk$//')
            if ! [[ "$ACTUAL_VERSION" =~ ^[0-9]+$ ]]; then
              echo "无法从 FinaSU 管理器 APK 文件名解析版本 ($(basename "$APK_FILE"))"
              exit 1
            fi
            MANAGER_VERSION="$ACTUAL_VERSION"

            # 内核侧对齐到发行版 tag 的同一提交（FinaSU Kbuild 以 30000 + 提交数计算
            # 版本，与管理器 versionCode 同源同值）
            KSU_COMMIT=$(git -C KernelSU rev-list -n 1 "refs/tags/$REL_TAG" 2>/dev/null || true)
            if [ -z "$KSU_COMMIT" ]; then
              echo "::warning::无法解析 Release tag $REL_TAG 对应的提交，内核侧将对齐默认分支 HEAD"
            else
              PIN_COUNT=$(git -C KernelSU rev-list --count "$KSU_COMMIT")
              PINNED_KSU_VERSION=$((30000 + PIN_COUNT))
              echo "内核 KSU 版本将对齐 Release $REL_TAG 提交 ${KSU_COMMIT:0:8}: $PINNED_KSU_VERSION"
              if [ "$MANAGER_VERSION" != "$PINNED_KSU_VERSION" ]; then
                echo "::warning::管理器实测版本 $MANAGER_VERSION 与 Release 提交对应的 KSU 版本 $PINNED_KSU_VERSION 不一致"
              fi
            fi

            # 提取管理器签名证书（DER size + sha256），供内核侧第二信任槽
            # （EXPECTED_SIZE2/HASH2）对齐；不注入时内核信任上游 KernelSU 默认槽，
            # root 会被官方 KernelSU 管理器抢占、FinaSU 管理器显示"未安装"
            CERT_INFO=$(python3 "$GITHUB_WORKSPACE/scripts/finasu_compat/extract_manager_cert.py" "$APK_FILE" | head -n1)
            if [ -z "$CERT_INFO" ]; then
              echo "::error::未能从 FinaSU 管理器 APK 提取签名证书"
              exit 1
            fi
            CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
            CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
            echo "管理器签名证书: size=$CERT_SIZE sha256=$CERT_HASH"

            echo "选择 FinaSU Release $REL_TAG, APK 实测版本 $MANAGER_VERSION"
            echo "MANAGER_VERSION=$MANAGER_VERSION" >> $GITHUB_ENV
            echo "managerVer=$MANAGER_VERSION" >> $GITHUB_OUTPUT
            echo "ksuCommit=$KSU_COMMIT" >> $GITHUB_OUTPUT
            echo "managerCertSize=$CERT_SIZE" >> $GITHUB_OUTPUT
            echo "managerCertHash=$CERT_HASH" >> $GITHUB_OUTPUT
            echo "MANAGER_FETCH_OK=true" >> $GITHUB_ENV
            exit 0
          fi

          FILENAME="build-manager.yml"

          get_manager_artifacts() {
            local artifacts="$1"
            if [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
              printf '%s' "$artifacts" | jq -r \
                '.artifacts[] | select(.name == "Manager-release" or .name == "Spoofed-Manager-release") | "\(.name)\t\(.archive_download_url)"'
            else
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" \
                '.artifacts[] | select((.name | ascii_downcase) | contains($needle)) | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          # 仿 BakaSU_CI：拉取官方 main 分支最新上传（push 或手动触发）的 Manager 构建，
          # 并以下载到的 APK 文件名实测 versionCode 命名，确保包名与包内容严格一致
          # 注意：runs 列表 API 的排序/缓存在部分仓库不可靠（可能漏掉最新构建），
          # 而 created 日期过滤参数走可靠查询路径，因此按日期窗口从今天往回推进检索
          RUNS_BASE="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success"
          CAND_FILE=$(mktemp)
          TODAY=$(date -u +%Y-%m-%d)

          for DAYS in 0 7 30 90 365; do
            if [ "$DAYS" -eq 0 ]; then
              FROM="$TODAY"
            else
              FROM=$(date -u -d "today - $DAYS days" +%Y-%m-%d)
            fi
            echo "检索 $FROM ~ $TODAY 期间官方 $EXPECTED_BRANCH 分支构建..."
            for PAGE in 1 2 3; do
              RUNS=""
              for ATTEMPT in 1 2 3; do
                RUNS=$(curl -s --fail --max-time 30 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "$RUNS_BASE&created=$FROM..$TODAY&per_page=30&page=$PAGE") && [ -n "$RUNS" ] && break
                echo "查询构建列表失败，重试 ($ATTEMPT/3)..."
                RUNS=""
                sleep 3
              done
              RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
              if [ "$RUN_COUNT" -eq 0 ]; then
                break
              fi
              for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
                BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
                HEAD_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
                HEAD_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")
                EVENT=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].event")
                CREATED=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].created_at")
                # 认领官方默认分支上传的构建（push 与 workflow_dispatch 均可，
                # 手动触发常用于正式上传前测试），跳过 PR / 其他分支构建
                #（SukiSU/BakaSU 为 main，FinaSU 为 master，FinaSU-dev 为 dev）
                if [ "$HEAD_BRANCH" != "$EXPECTED_BRANCH" ] || { [ "$EVENT" != "push" ] && [ "$EVENT" != "workflow_dispatch" ]; }; then
                  echo "跳过构建 $BUILD_ID ($HEAD_BRANCH/$EVENT): 非官方 $EXPECTED_BRANCH 分支构建"
                  continue
                fi
                printf '%s\t%s\t%s\n' "$CREATED" "$BUILD_ID" "$HEAD_SHA" >> "$CAND_FILE"
              done
            done
            if [ -s "$CAND_FILE" ]; then
              break
            fi
          done

          if [ ! -s "$CAND_FILE" ]; then
            rm -f "$CAND_FILE"
            # dev 渠道是自测渠道：拿不到 dev 的 CI 构建时不应阻断内核编译，
            # 退化为"内核跟随 dev HEAD + 证书从最新 Release APK 提取"
            # （dev/manifest 用同一套 KEYSTORE 签名，证书通常一致）
            if [ "${{ inputs.ksu_variant }}" == "FinaSU-dev" ]; then
              echo "::warning::未找到 FinaSU dev 分支上传的 Manager 构建，内核侧改为跟随 dev HEAD，证书回退到最新 Release APK"
              exit 0
            fi
            echo "未找到官方 $EXPECTED_BRANCH 分支上传的 Manager 构建。"
            exit 1
          fi
          # sort -u 去重（窗口扩大后会重复收集），按创建时间降序（最新优先）
          CAND_COUNT=$(sort -u -t$'\t' -k1,1r "$CAND_FILE" | wc -l)
          echo "共找到 $CAND_COUNT 个官方 $EXPECTED_BRANCH 分支构建，从最新开始逐个下载（以 APK 文件名实测版本）..."

          while IFS=$'\t' read -r CREATED BUILD_ID HEAD_SHA; do
            ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
            CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
            if [ -z "$CANDIDATE_LIST" ]; then
              echo "跳过构建 $BUILD_ID ($EXPECTED_BRANCH, $CREATED): 未找到包含 '$KSUM' 的产物"
              continue
            fi

            echo "下载构建 $BUILD_ID ($EXPECTED_BRANCH, $CREATED, ${HEAD_SHA:0:8}) 的产物..."
            rm -rf manager-artifacts
            mkdir -p manager-artifacts
            while IFS=$'\t' read -r NAME URL; do
              SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
              if ! curl -sL --fail -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                -o "manager-artifacts/$SAFE_NAME.zip" "$URL"; then
                echo "下载 $NAME 失败"
                continue
              fi
              mkdir -p "manager-artifacts/$SAFE_NAME"
              unzip -oq "manager-artifacts/$SAFE_NAME.zip" -d "manager-artifacts/$SAFE_NAME" || echo "解压 $NAME 失败"
              rm -f "manager-artifacts/$SAFE_NAME.zip"
            done <<< "$CANDIDATE_LIST"

            # 从 APK 文件名提取实测 versionCode 作为 artifact 命名
            # 优先 arm64-v8a release（BakaSU 下游只保留这一个 ABI）
            APK_FILE=$(find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | head -n 1)
            if [ -z "$APK_FILE" ]; then
              APK_FILE=$(find manager-artifacts -type f -name "*release.apk" ! -name "*debug*" | head -n 1)
            fi
            if [ -z "$APK_FILE" ]; then
              echo "跳过构建 $BUILD_ID ($EXPECTED_BRANCH, $CREATED): artifact 中无 release APK"
              continue
            fi
            # 先剥离 ABI 段再提取版本，避免 x86_64 的 "_64" 等数字尾巴被误当成 versionCode
            CLEAN_NAME=$(basename "$APK_FILE" | sed -E 's/-(arm64-v8a|armeabi-v7a|armv7|riscv64|x86_64|x86|universal)-release\.apk$/.apk/')
            ACTUAL_VERSION=$(echo "$CLEAN_NAME" | grep -oE '_[0-9]+' | tail -n 1 | tr -d '_')
            if ! [[ "$ACTUAL_VERSION" =~ ^[0-9]+$ ]]; then
              echo "跳过构建 $BUILD_ID ($EXPECTED_BRANCH, $CREATED): 无法从 APK 文件名解析版本 ($(basename "$APK_FILE"))"
              continue
            fi

            MANAGER_VERSION="$ACTUAL_VERSION"
            MANAGER_BUILD_ID="$BUILD_ID"
            MANAGER_HEAD_SHA="$HEAD_SHA"
            break
          done < <(sort -u -t$'\t' -k1,1r "$CAND_FILE")
          rm -f "$CAND_FILE"

          if [ -z "$MANAGER_VERSION" ]; then
            if [ "${{ inputs.ksu_variant }}" == "FinaSU-dev" ]; then
              echo "::warning::未获取到 FinaSU dev 分支最新 Manager artifact，内核侧改为跟随 dev HEAD，证书回退到最新 Release APK"
              exit 0
            fi
            echo "未获取到官方 $EXPECTED_BRANCH 分支最新上传的 Manager artifact。"
            exit 1
          fi
          echo "选择 Manager 构建 $MANAGER_BUILD_ID ($EXPECTED_BRANCH, ${MANAGER_HEAD_SHA:0:8}), APK 实测版本 $MANAGER_VERSION"

          # 内核侧将对齐到该构建的同一提交（BakaSU/FinaSU：直接检出；SukiSU：改写版本来源 REPO_BRANCH），
          # 因此对比"该提交对应的 KSU 版本"而非默认分支 HEAD 的版本
          PIN_COUNT=$(git -C KernelSU rev-list --count "$MANAGER_HEAD_SHA" 2>/dev/null || echo "")
          if [ -n "$PIN_COUNT" ]; then
            case "${{ inputs.ksu_variant }}" in
              BakaSU) PINNED_KSU_VERSION=$((30700 + PIN_COUNT)) ;;
              SukiSU) PINNED_KSU_VERSION=$((40000 + PIN_COUNT - 2815)) ;;
              FinaSU|FinaSU-dev) PINNED_KSU_VERSION=$((30000 + PIN_COUNT)) ;;
              *)      PINNED_KSU_VERSION="" ;;
            esac
            if [ -n "$PINNED_KSU_VERSION" ]; then
              echo "内核 KSU 版本将对齐官方构建提交 ${MANAGER_HEAD_SHA:0:8}: $PINNED_KSU_VERSION"
              if [ "$MANAGER_VERSION" != "$PINNED_KSU_VERSION" ]; then
                echo "::warning::Manager 实测版本 $MANAGER_VERSION 与官方构建提交对应的 KSU 版本 $PINNED_KSU_VERSION 不一致"
              fi
            elif [ -n "${KSU_VERSION:-}" ] && [ "$MANAGER_VERSION" != "$KSU_VERSION" ]; then
              echo "::warning::Manager 实测版本 $MANAGER_VERSION 与内核 KSU 版本 ${KSU_VERSION} 不一致"
            fi
          elif [ -n "${KSU_VERSION:-}" ] && [ "$MANAGER_VERSION" != "$KSU_VERSION" ]; then
            echo "::warning::Manager 实测版本 $MANAGER_VERSION 与内核 KSU 版本 ${KSU_VERSION} 不一致（无法计算官方构建提交对应的版本）"
          fi

          echo "MANAGER_VERSION=$MANAGER_VERSION" >> $GITHUB_ENV
          echo "managerVer=$MANAGER_VERSION" >> $GITHUB_OUTPUT
          echo "ksuCommit=$MANAGER_HEAD_SHA" >> $GITHUB_OUTPUT

          if [ "${{ inputs.ksu_variant }}" == "BakaSU" ]; then
            echo "仅保留 BakaSU arm64-v8a release 管理器..."
            find manager-artifacts -type f -name "*.apk" ! -name "*-arm64-v8a-release.apk" -delete
            find manager-artifacts -type f -name "*debug*.apk" -delete
            if ! find manager-artifacts -type f -name "*-arm64-v8a-release.apk" | grep -q .; then
              echo "未找到 BakaSU arm64-v8a release 管理器。"
              exit 1
            fi
            find manager-artifacts -type f -name "*.apk" -print
          fi

          if [ "${{ inputs.ksu_variant }}" == "FinaSU" ] || [ "${{ inputs.ksu_variant }}" == "FinaSU-dev" ]; then
            # 从本次分发的管理器 APK 提取签名证书（DER），供内核侧第二信任槽
            # （EXPECTED_SIZE2/EXPECTED_HASH2）对齐。FinaSU 的内核只信任槽内
            # 签名的管理器，不注入证书时内核会转而信任上游 KernelSU 默认槽，
            # 导致 root 被官方 KernelSU 管理器抢占、FinaSU 管理器显示"未安装"。
            echo "从管理器 APK 提取签名证书..."
            CERT_INFO=$(python3 "$GITHUB_WORKSPACE/scripts/finasu_compat/extract_manager_cert.py" "$APK_FILE" | head -n1)
            if [ -z "$CERT_INFO" ]; then
              echo "::warning::未能从 FinaSU 管理器 APK 提取签名证书，内核侧将回退到最新 Release APK 提取"
              exit 0
            fi
            CERT_SIZE=$(echo "$CERT_INFO" | awk '{print $1}')
            CERT_HASH=$(echo "$CERT_INFO" | awk '{print $2}')
            echo "管理器签名证书: size=$CERT_SIZE sha256=$CERT_HASH"
            echo "managerCertSize=$CERT_SIZE" >> $GITHUB_OUTPUT
            echo "managerCertHash=$CERT_HASH" >> $GITHUB_OUTPUT
          fi

          echo "MANAGER_FETCH_OK=true" >> $GITHUB_ENV

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        continue-on-error: true
        run: |
          # 模块通过 sidex15/susfs4ksu-module 的 GitHub Releases 发布，拉取最新 Release 资产
          RELEASE_API="https://api.github.com/repos/sidex15/susfs4ksu-module/releases/latest"
          RELEASE_JSON=""
          for ATTEMPT in 1 2 3; do
            RELEASE_JSON=$(curl -s --fail --max-time 30 \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RELEASE_API") \
              && [ -n "$RELEASE_JSON" ] && break
            echo "获取 Release 信息失败，重试 ($ATTEMPT/3)..."
            sleep 5
          done
          if [ -z "$RELEASE_JSON" ]; then
            echo "无法获取 susfs4ksu-module 最新 Release 信息"
            exit 1
          fi

          TAG_NAME=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          ASSET_URL=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select((.name | contains("ksu_module_susfs")) and (.name | endswith(".zip"))) | .browser_download_url' | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "Release $TAG_NAME 中未找到 ksu_module_susfs 模块 zip"
            exit 1
          fi

          NAME="ksu_module_susfs.zip"
          echo "下载 SUSFS 模块: $NAME (Release $TAG_NAME)"
          if ! curl -sL --fail --retry 3 --max-time 120 -o "$NAME" "$ASSET_URL"; then
            echo "下载 SUSFS 模块失败: $ASSET_URL"
            exit 1
          fi
          echo "SUSFS_NAME=$TAG_NAME" >> $GITHUB_ENV

          # Release 资产本身即完整模块 zip，校验完整性后直接放入模块目录
          if ! unzip -t "$NAME" >/dev/null 2>&1; then
            echo "下载的 SUSFS 模块 zip 损坏"
            exit 1
          fi
          mkdir -p susfs-module
          mv "$NAME" "susfs-module/$NAME"
          ls -la susfs-module/

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      - name: 上传APK
        if: env.MANAGER_FETCH_OK == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.ksu_variant }}-Manager(${{ env.MANAGER_VERSION }})
          path: |
            manager-artifacts/**/*.apk
          if-no-files-found: error

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
